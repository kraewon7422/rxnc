[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rxnc"
version = "0.1.0"
description = "A compiler from a reaction-mechanism DSL to fast rate and Jacobian kernels"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "kraewon7422" }]
keywords = ["chemical engineering", "kinetics", "compiler", "DSL", "symbolic differentiation", "code generation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Software Development :: Compilers",
]
dependencies = ["numpy>=1.23"]

[project.urls]
Homepage = "https://github.com/kraewon7422/rxnc"
Issues = "https://github.com/kraewon7422/rxnc/issues"

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.4"]

[project.scripts]
rxnc = "rxnc.cli:main"

[tool.setuptools]
packages = ["rxnc"]

[tool.pytest.ini_options]
pythonpath = [".", "tests"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["UP006", "UP007", "UP035", "UP045", "B008"]

[tool.ruff.lint.isort]
known-first-party = ["rxnc"]

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check .
      - run: ruff format --check .

  test:
    needs: lint
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        include:
          - os: windows-latest
            python-version: "3.12"
          - os: macos-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - name: Install reactor-api so the export oracle runs
        run: pip install "reactor-api @ git+https://github.com/kraewon7422/reactor-api@main"
      - run: pytest -q
      - name: Smoke-test the CLI
        run: |
          rxnc check examples/no_oxidation.rxn
          rxnc jacobian examples/lh_surface.rxn
          rxnc eval examples/multiplicity.rxn --at "A=1000" -T 350
      - name: Backend benchmark
        run: python examples/benchmark.py
